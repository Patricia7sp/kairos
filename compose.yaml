# Stack do Kairos para o Komodo.
#
# EXPOSIÇÃO: a porta é publicada apenas no endereço Tailscale do host. Isto é
# deliberado e é a linha mais importante do arquivo. O dashboard entrega o
# token de sessão dentro do HTML da página inicial — quem alcança a porta
# obtém o token e, com ele, o chat do agente e o REPL de terminal. Trocar
# `100.87.25.101:9119:9119` por `9119:9119` publicaria isso na LAN inteira.

services:
  kairos:
    build:
      context: .
      dockerfile: Dockerfile
    image: kairos:local
    # s6-overlay e o pacote Codex fixado desta imagem são x86_64.
    platform: linux/amd64
    container_name: kairos
    restart: unless-stopped

    ports:
      - "100.87.25.101:9119:9119"

    volumes:
      # /opt/data é KAIROS_HOME: state.db, auth.json, skills, codex-runtime e o
      # marcador de drenagem. Assim o CODEX_HOME dedicado persiste no mesmo
      # volume nomeado sem copiar credenciais para a imagem.
      - kairos-data:/opt/data
      # O fallback criptografado recebe a passphrase por arquivo administrado,
      # nunca por argumento ou variável de ambiente inspecionável.
      - /etc/komodo/secrets/kairos-vault-passphrase:/run/secrets/kairos-vault-passphrase:ro
      # O runtime vem desabilitado e sem projetos. Para ativá-lo, monte aqui
      # somente cada diretório cadastrado em agent_runtime.allowed_directories,
      # usando no config exatamente o caminho de destino dentro do container.
      # Exemplo deliberadamente inativo (não aponta para projeto do operador):
      # - /srv/projects/example:/projects/example:rw

    environment:
      KAIROS_DASHBOARD_PORT: "9119"
      KAIROS_DISABLE_KEYRING: "1"
      KAIROS_VAULT_PASSPHRASE_FILE: "/run/secrets/kairos-vault-passphrase"
      # UID/GID do dono do volume. O stage2 roda como root só para ajustá-los
      # e então cada serviço derruba privilégio no próprio `run`.
      KAIROS_UID: "10000"
      # Ativar junto com COMPOSE_PROFILES=agent-runtime; evita dois hosts
      # disputando o mesmo banco/socket. O padrão mantém o runtime interno.
      KAIROS_RUNTIME_EXTERNAL: "${KAIROS_RUNTIME_EXTERNAL:-0}"
      # KAIROS_WEB_TOKEN foi DELIBERADAMENTE removida daqui.
      #
      # Um token em variável de ambiente aparece em `docker inspect`, no dump
      # de configuração da stack e em qualquer `printenv` — quem alcança o host
      # o lê sem precisar de mais nada. O token agora vive em
      # /opt/data/web-token (0600, dentro do volume, portanto sobrevive a
      # redeploy), gerado com `kairos token new`.
      #
      # Para reintroduzi-la — um cofre que injeta o valor, por exemplo — basta
      # declará-la no ambiente da stack: a variável tem precedência sobre o
      # arquivo.

    # O gateway é o serviço principal e não escuta em porta nenhuma, então o
    # healthcheck sonda o dashboard, que é o que precisa estar alcançável.
    # `/api/health` é a única rota aberta sem token — foi mantida aberta
    # exatamente para isto.
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9119/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 40s
      retries: 3

    # O s6-overlay EXIGE ser PID 1; `init: true` intercalaria o init do Docker
    # e degradaria para o caminho sem supervisão, derrubando o dashboard.
    init: false

    stop_grace_period: 30s

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  # Mantém a imagem referenciada mesmo quando nenhuma sessão tem worker ativo.
  runtime-worker-image:
    profiles: [agent-runtime]
    image: "${KAIROS_RUNTIME_WORKER_IMAGE:-kairos:external-sandbox}"
    pull_policy: never
    platform: linux/amd64
    container_name: kairos-runtime-worker-image
    restart: unless-stopped
    user: "10000:10000"
    entrypoint: ["/bin/sleep"]
    command: ["infinity"]
    network_mode: none
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 8
    mem_limit: 16m
    cpus: 0.05

  runtime-broker:
    profiles: [agent-runtime]
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime-broker
    image: kairos:runtime-broker
    platform: linux/amd64
    container_name: kairos-runtime-broker
    restart: unless-stopped
    init: true
    user: "10000:10000"
    group_add:
      - "${KAIROS_DOCKER_GID:-983}"
    depends_on:
      kairos:
        condition: service_healthy
      runtime-worker-image:
        condition: service_started
    environment:
      KAIROS_HOME: /opt/data
      HOME: /opt/data
    volumes:
      - kairos-data:/opt/data
      # O broker é confiável e administra workers. A aplicação e os workers
      # NÃO recebem este socket; :ro não restringiria a API do daemon.
      - /var/run/docker.sock:/var/run/docker.sock
      - type: bind
        source: "${KAIROS_RUNTIME_PROJECT:-/srv/kairos-runtime-project}"
        target: /projects/current
        read_only: true
        bind:
          create_host_path: false
      # Catálogo opcional; sem configuração reutiliza um bind já existente.
      - type: bind
        source: "${KAIROS_RUNTIME_PROJECT_CATALOG:-${KAIROS_RUNTIME_PROJECT:-/srv/kairos-runtime-project}}"
        target: /projects/versions
        read_only: true
        bind:
          create_host_path: false
      # A autorização de /projects/kairos continua explícita no config.yaml.
      # Sem caminho adicional, reutiliza o projeto base e não amplia o acesso.
      - type: bind
        source: "${KAIROS_RUNTIME_KAIROS_PROJECT:-${KAIROS_RUNTIME_PROJECT:-/srv/kairos-runtime-project}}"
        target: /projects/kairos
        read_only: true
        bind:
          create_host_path: false
    read_only: true
    tmpfs:
      - /tmp:rw,nosuid,nodev,size=128m
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    pids_limit: 256
    mem_limit: 2g
    cpus: 2
    stop_signal: SIGINT
    stop_grace_period: 90s
    healthcheck:
      test: ["CMD", "/opt/kairos/.venv/bin/python", "/opt/kairos/docker/broker/healthcheck.py"]
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  kairos-data:
