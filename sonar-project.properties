# SonarQube Cloud — análise advisory do Kairos.
#
# Consultivo, não gate: `wait=false`. O Ruff continua sendo a autoridade de
# lint (ver docs/decisoes.md, D-CI.SONAR). O job `sonar` do CI consome o
# `coverage.xml` gerado pelo job `tests` e nunca reexecuta a suíte.

sonar.projectKey=Patricia7sp_kairos
sonar.organization=patricia7sp
sonar.projectName=Kairos

sonar.sources=.
sonar.tests=tests
sonar.python.version=3.11

# Cobertura combinada do job `tests` (baixada como artefato pelo job `sonar`).
sonar.python.coverage.reportPaths=coverage.xml

# Exclusões. Fonte única: o `extend-exclude` (ruff) e o `omit` de cobertura no
# pyproject.toml — manter as duas pontas em sincronia. `skills/` é conteúdo de
# terceiros; os frontends não são Python do núcleo. `docker/` e `scripts/` são
# receita fora da suíte (omitidos da cobertura pelo mesmo motivo); `.venv/`
# já cai via scm-exclusions, mas o espelho explícito blinda contra deriva.
# `tests/` precisa estar aqui (e não só em `sonar.tests`): com `sources=.`
# o diretório pertence aos dois conjuntos e o scanner aborta com "can't be
# indexed twice" — a exclusão resolve a dupla indexação. Issues em teste
# já eram ruído (ver cpd.exclusions).
sonar.exclusions=tests/**,skills/**,ui-tui/**,web/**,apps/**,docker/**,scripts/**,.venv/**,**/__pycache__/**

# Duplicação em teste é ruído: um teste curto e explícito é melhor que um
# helper genérico compartilhado.
sonar.cpd.exclusions=tests/**,skills/**,ui-tui/**,web/**,apps/**

# Advisory: o job reporta; não bloqueia merge (ver D-CI.SONAR).
sonar.qualitygate.wait=false

# Regras do Sonar silenciadas para respeitar decisões deliberadas já
# registradas no pyproject.toml. Cada ignore cita o motivo do Ruff.
# (Calibragem fina — novas regras — fica para depois do primeiro scan real
# com token; só entram aqui as que têm contraparte Sonar confirmada.)
sonar.issue.ignore.multicriteria=longLines
# python:S103 "Lines should not be too long" espelha o E501 ignorado no Ruff:
# o `ruff format` cuida do comprimento; falhar por isso é ruído.
sonar.issue.ignore.multicriteria.longLines.ruleKey=python:S103
sonar.issue.ignore.multicriteria.longLines.resourceKey=**/*.py
