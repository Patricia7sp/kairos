# CI do Kairos.
#
# Um workflow só, com jobs paralelos. O legado tem 28 workflows porque tem 28
# superfícies; aqui a divisão é por FERRAMENTA, e um job existe quando falha
# por um motivo distinto dos outros — não para parecer completo.
#
# Actions fixadas por SHA, não por tag: uma tag é mutável, e confiar nela
# significa executar código arbitrário do mantenedor da action a cada push.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.11"
  KAIROS_RUNTIME_LIVE: "0"

jobs:
  tests:
    name: Testes (unitários)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Instalar
        run: uv sync --python "$PYTHON_VERSION" --extra dev
      - name: Preparar cliente v8 para downgrade
        run: bash scripts/prepare-skill-v8-client.sh
      - name: Preparar cliente v10 para downgrade
        run: bash scripts/prepare-skill-v10-client.sh
      # Sem Docker aqui: os testes de integração ficam no job `image`, para
      # que uma falha de build não se confunda com falha de lógica.
      # Regressões cruzam o journal Python com o reducer JavaScript servido.
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
      # Cobertura consumida pelo job `sonar` (advisory). O `coverage` (>=7.13)
      # instala um `.pth` permanente que mede subprocessos quando
      # COVERAGE_PROCESS_START aponta para um arquivo de config. COVERAGE_FILE
      # absoluto impede que filhos com cwd em tempdir deixem `.coverage.*` fora
      # do repositório e sumam do `combine`. Não se roda a suíte duas vezes: o
      # job `sonar` só consome o `coverage.xml`.
      - name: pytest (com cobertura)
        env:
          COVERAGE_PROCESS_START: ${{ github.workspace }}/pyproject.toml
          COVERAGE_FILE: ${{ github.workspace }}/.coverage
          KAIROS_COVERAGE_ROOT: ${{ github.workspace }}
        run: |
          uv run coverage run -m pytest -q -m "not runtime_live" --deselect tests/test_container.py::RealImageTests
          uv run coverage combine
          uv run coverage xml
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage
          path: coverage.xml
          if-no-files-found: error

  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv sync --python "$PYTHON_VERSION" --extra dev
      - name: ruff check
        run: uv run ruff check .
      - name: ruff format --check
        run: uv run ruff format --check .

  shell:
    name: Lint de shell (shellcheck)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      # A imagem do container é shell na prática: entrypoint, bootstrap,
      # wrapper e o shim de UID. Um erro de quoting ali não aparece em teste
      # de Python.
      - uses: ludeeus/action-shellcheck@00cae500b08a931fb5698e11e79bfbd38e612a38 # v2.0.0
        env:
          SHELLCHECK_OPTS: -e SC1091
        with:
          scandir: "."
          # O glob apanha os marcadores s6-rc em user/contents.d — arquivos
          # VAZIOS, não scripts, e por isso rendem SC2148 (sem shebang). Não
          # há shebang a acrescentar: no s6-rc o que importa é o NOME do
          # arquivo, e o conteúdo é deliberadamente nada.
          ignore_names: "main-kairos runtime"
          # `skills/` é conteúdo instalável de terceiros — mesma razão pela
          # qual o ruff também o ignora.
          ignore_paths: "skills"

  dockerfile:
    name: Lint dos Dockerfiles (hadolint)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: hadolint/hadolint-action@54c9adbab1582c2ef04b2016b760714a4bfde3cf # v3.1.0
        with:
          dockerfile: Dockerfile
          config: .hadolint.yaml
      # A imagem-stub também é receita: sem lint, um DL3046 novo passaria
      # despercebido. A action lint um arquivo por passo, então o stub entra
      # como passo próprio — na mesma versão binária validada localmente
      # (v2.12.0) para não depender do binário flutuante da action.
      - name: Lint do Dockerfile.stub
        run: docker run --rm -v "$PWD:/mnt" -w "/mnt" hadolint/hadolint:v2.12.0 hadolint -c .hadolint.yaml Dockerfile.stub

  image:
    name: Imagem + testes de integração
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv sync --python "$PYTHON_VERSION" --extra dev
      # `docker build --check` valida a estrutura do Dockerfile. O build real
      # pega o que ela não alcança — deriva entre pyproject e COPY, diretório
      # de destino ausente, PATH de runtime. Foram três bugs assim na Tarefa
      # 07; por isso o build entra no CI, e não só o --check.
      - name: docker build --check
        run: docker build --check .
      - name: Construir a imagem
        run: docker build -t kairos:test .
      - name: Construir o broker separado
        run: |
          docker build --target runtime-broker -t kairos:runtime-broker-test .
          docker run --rm --entrypoint docker kairos:runtime-broker-test --version
      - name: Imagem-stub para o ciclo de vida s6
        # Receita commitada (Dockerfile.stub): espelha a estrutura da imagem
        # real — s6-overlay, dispatch, stage2, cont-init — trocando só o que
        # os 7 testes de RealImageTests validam (eco de UID, boom→42, ordem
        # dos cont-init, marcador e remap). Antes isto regenerava um stub
        # inline que DESCARTABA a receita commitada.
        run: |
          docker build --check -f Dockerfile.stub .
          docker build -f Dockerfile.stub -t kairos:stub .
      - name: Testes de integração
        run: uv run pytest -q tests/test_container.py::RealImageTests

  docker-sessions:
    name: Sessões Docker isoladas (offline)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv sync --python "$PYTHON_VERSION" --extra dev
      - name: Validar e construir worker
        run: |
          docker build --check -f docker/external-sandbox/Dockerfile .
          docker build -f docker/external-sandbox/Dockerfile -t kairos:external-sandbox .
      # O Codex executa ferramentas reais, mas o modelo é simulado por SSE.
      # Nenhuma credencial ChatGPT nem chamada paga entra neste job.
      - name: Isolamento, checkpoint e retomada
        env:
          KAIROS_EXTERNAL_SANDBOX_TEST: "1"
        run: >-
          timeout -k 10s 240s uv run pytest -q
          tests/test_external_sandbox_integration.py
          tests/test_docker_session_worker.py
          tests/test_docker_sessions_integration.py

  frontend:
    name: Frontends (vitest + tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: actions/setup-node@39370e3970a6d050c480ffad4ff0ed4d3fdee5af # v4.1.0
        with:
          node-version: "22"
      # A TUI é TypeScript/React: a suíte de Python não a cobre, e um bug de
      # virtualização não aparece em pytest.
      - name: Instalar e verificar os três frontends
        # ui-tui (TUI React/Ink), web (SPA) e apps/desktop (Electron).
        # A suíte de Python não cobre nenhum: um bug de virtualização, de
        # formulário ou de CSP não aparece em pytest.
        run: |
          for f in ui-tui web apps/desktop; do
            npm install --prefix "$f"
            npx --prefix "$f" tsc --noEmit -p "$f"
            npm test --prefix "$f"
          done

  evals:
    name: Recall de compactação (gate)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      - run: uv sync --python "$PYTHON_VERSION" --extra dev
      # G-19: no legado o harness de evals NUNCA roda em CI — os 28 workflows
      # não referenciam `evals/` de forma nenhuma. Medir sem nunca medir é o
      # mesmo que não medir, então o gate é um job próprio: uma queda de
      # recall reprova o PR, e não se confunde com falha de lógica.
      - name: Gate de recall
        run: uv run pytest -q tests/test_evals.py

  lockfile:
    name: uv.lock em dia
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
      # Um lock desatualizado passa localmente e quebra o build da imagem, que
      # resolve com `--frozen`. Barato de checar, caro de descobrir depois.
      - name: uv lock --check
        run: uv lock --check

  benchmark-ledger:
    name: Benchmark pareado do ledger (opt-in)
    if: github.event_name == 'pull_request' && contains(github.event.pull_request.labels.*.name, 'benchmark-ledger')
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KAIROS_BENCHMARK_BASELINE: b7346adeee312368746fddb3ca7cfe3058c49b99
      KAIROS_BENCHMARK_CANDIDATE: ${{ github.event.pull_request.head.sha }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: astral-sh/setup-uv@20cfd1bf945f4377ade1205e4dbc17946fc9a30d # v10.0.1
        with:
          enable-cache: true
      - name: Instalar ambiente congelado
        run: uv sync --python "$PYTHON_VERSION" --extra dev --frozen
      - name: Medir sequencialmente na mesma CPU do runner exclusivo
        run: |
          env -u COVERAGE_PROCESS_START -u COVERAGE_FILE -u KAIROS_COVERAGE_ROOT uv run --frozen python - <<'PY'
          import gc
          import json
          import os
          import platform
          import subprocess
          import sys
          from pathlib import Path

          candidate = os.environ["KAIROS_BENCHMARK_CANDIDATE"]
          observed = subprocess.check_output(["git", "rev-parse", "HEAD"], text=True).strip()
          if observed != candidate or sys.gettrace() is not None or sys.getprofile() is not None:
              raise RuntimeError("benchmark_checkout_or_tracing_invalid")
          if not gc.isenabled():
              raise RuntimeError("benchmark_garbage_collection_disabled")
          available = sorted(os.sched_getaffinity(0))
          os.sched_setaffinity(0, {available[0]})
          environment = {
              "candidate_sha": candidate,
              "baseline_sha": os.environ["KAIROS_BENCHMARK_BASELINE"],
              "runner_os": os.environ["RUNNER_OS"],
              "runner_arch": os.environ["RUNNER_ARCH"],
              "run_id": os.environ["GITHUB_RUN_ID"],
              "run_attempt": os.environ["GITHUB_RUN_ATTEMPT"],
              "platform": platform.platform(),
              "python": platform.python_version(),
              "available_cpus": available,
              "selected_cpus": sorted(os.sched_getaffinity(0)),
              "gc_enabled": gc.isenabled(),
          }
          temporary = Path(os.environ["RUNNER_TEMP"])
          (temporary / "skill-writer-environment.json").write_text(json.dumps(environment, indent=2) + "\n")
          print(json.dumps({"event": "benchmark_environment", **environment}), flush=True)
          os.execv(sys.executable, [
              sys.executable, "-m", "scripts.benchmark_skill_writer_pairs",
              "--baseline", environment["baseline_sha"],
              "--candidate", candidate,
              "--output-dir", str(temporary / "skill-writer-pairs"),
          ])
          PY
      - name: Preservar todos os pares e o ambiente
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: skill-writer-benchmark-${{ github.event.pull_request.head.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/skill-writer-pairs/
            ${{ runner.temp }}/skill-writer-environment.json
          if-no-files-found: error
          retention-days: 90

  # SonarQube Cloud: observabilidade de cobertura/duplicação/complexidade.
  # ADVISORY — não bloqueia merge e NÃO entra em `deploy.needs`. Consome o
  # `coverage.xml` do job `tests` por artefato; nunca reexecuta a suíte. Sem
  # `SONAR_TOKEN` (PR de fork) o passo é pulado com aviso explícito — nunca
  # reporta análise que não ocorreu. Ver docs/decisoes.md, D-CI.SONAR.
  sonar:
    name: SonarQube Cloud (advisory)
    needs: [tests]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          # O sonar precisa do histórico para resolver "código novo" e SCM blame.
          fetch-depth: 0
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: coverage
      - name: Análise SonarQube Cloud
        if: env.SONAR_TOKEN != ''
        uses: SonarSource/sonarqube-scan-action@d209202bc7d53ff1cc128f7f907dac145c9d6ae9 # v8.3.0
      - name: Sem token — análise pulada
        if: env.SONAR_TOKEN == ''
        run: |
          echo "análise Sonar pulada: SONAR_TOKEN ausente (PR de fork ou segredo não configurado)"

  # Pós-merge: com todos os jobs acima verdes na main, dispara o deploy da
  # stack no Komodo (scripts/komodo-deploy.sh: DeployStack via API REST e poll
  # do Update até Complete+success). Só roda na main — PRs não mexem em um
  # ambiente que não é o deles. `workflow_dispatch` na main reproduz o mesmo
  # passo (re-deploy manual, ex. após trocar segredos).
  #
  # Falha se os segredos não existirem (KOMODO_HOST / KOMODO_API_KEY): deploy
  # sem gatilho não é sucesso silencioso, é erro de configuração barulhento.
  # Este job roda em runner SELF-HOSTED dentro do tailnet: os runners
  # ubuntu-latest do GitHub não alcançam rede privada (o Core publica só em
  # 100.87.25.101:9120, Tailscale). Registrar o runner com `runs-on: self-hosted`
  # nesta repo antes de esperar o deploy — ver docs/ci-cd-komodo.md.
  deploy:
    name: Deploy no Komodo
    needs: [tests, lint, shell, dockerfile, image, docker-sessions, frontend, evals, lockfile]
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    runs-on: self-hosted
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Disparar e acompanhar o deploy no Komodo
        env:
          KOMODO_HOST: ${{ secrets.KOMODO_HOST }}
          KOMODO_API_KEY: ${{ secrets.KOMODO_API_KEY }}
          KOMODO_API_SECRET: ${{ secrets.KOMODO_API_SECRET }}
          KOMODO_STACK: ${{ vars.KOMODO_STACK || 'kairos' }}
        run: scripts/komodo-deploy.sh
