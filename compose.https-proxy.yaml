# Projeto separado: pode ser cadastrado antes de recriar o Kairos no Komodo.
name: kairos-https
services:
  proxy:
    image: tailscale/tailscale:v1.104.7@sha256:72c1e19e0aedca96b8533bbb0b4368564410ff20b17e53b804eb6c1f04a31be4
    container_name: kairos-https-proxy
    hostname: kairos-https-proxy
    restart: unless-stopped
    entrypoint: ["/usr/local/bin/tailscaled"]
    command:
      - --tun=userspace-networking
      - --statedir=/var/lib/tailscale
      - --no-logs-no-support
    volumes:
      - identidade:/var/lib/tailscale
    tmpfs:
      - /run/tailscale:rw,noexec,nosuid,nodev,mode=0755
      - /tmp:rw,noexec,nosuid,nodev,size=16m
    read_only: true
    cap_drop: [ALL]
    security_opt: ["no-new-privileges:true"]
    networks: [egress, backend]

volumes:
  identidade:

networks:
  egress:
  backend:
    name: kairos-https-backend
    internal: true
