# Config semeado no primeiro boot do container.
# Só o mínimo: tudo além disto é escolha do operador, não default nosso.
display:
  language: en
sessions:
  cjk_fts: true
agent_runtime:
  enabled: false
  codex_binary: /usr/local/bin/codex
  codex_version: 0.153.4
  allowed_directories: []
  project_catalogs: []
  broad_access_enabled: false
