  command: "命令: {command}"
  choose_short: "[a]允许一次  [s]本会话  [d]拒绝"
  choose_long: "是否允许执行此命令？[o]一次 / [s]本会话 / [a]始终 / [d]拒绝 / [n]从不"
  denied: "已拒绝。命令未执行。"
  denied_permanent: "被永久拒绝规则拦截: {pattern}"
  timeout: "{seconds}秒内未响应 — 默认拒绝。"
  sensitive_path: "敏感路径 {path} 始终需要确认，即使在自主策略下也是如此。"
  outside_workspace: "{path} 位于工作区之外 — 即使在自主策略下也需要确认。"

gateway:
