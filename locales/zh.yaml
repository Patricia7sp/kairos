  pairing_locked: "尝试次数过多。请在 {minutes} 分钟后重试。"
  unauthorized: "此对话未经授权。"

session:
  compacted: "上下文已压缩: 已归档 {removed} 条消息。"
  compaction_disabled: "上下文已满且自动压缩已关闭。请使用 /compress、/new 或更大的模型。"
  turn_busy: "此对话已有其他轮次正在运行。"
  storage_busy: "存储正忙 — 请重新发送。"
  storage_readonly: "存储处于只读状态。请检查磁盘空间和权限。"

i18n:
